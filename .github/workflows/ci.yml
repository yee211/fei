name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux search tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Windows search tool
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress -y
      - run: python -m pip install -e ".[mcp]" wheel
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/eval_workflows.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_install.py dist
